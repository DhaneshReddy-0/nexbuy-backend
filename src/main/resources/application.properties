# ── Database ─────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexbuy_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Guna@0102}

# ── JPA ──────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── App ──────────────────────────────────────────────────────────────
spring.application.name=nexbuy-backend
server.port=${PORT:8080}

# ── JWT ──────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:nexbuy-change-this-secret-in-production-min32chars!!}
app.jwt.expiration=86400000

# ── Jackson ──────────────────────────────────────────────────────────
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.fail-on-empty-beans=false
